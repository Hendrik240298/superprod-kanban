name: Test and package plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check formatting and JavaScript
        run: |
          deno fmt --check src/ tests/
          deno check src/board-core.js src/board-ui.js src/plugin.js
      - name: Test
        run: deno test --allow-read tests/
      - name: Build plugin ZIP
        run: |
          python3 build.py
          python3 -m zipfile -t dist/project-kanban.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("dist/project-kanban.zip"); assert set(z.namelist()) == {"manifest.json", "plugin.js", "index.html"}'
      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import json, os, zipfile; z=zipfile.ZipFile("dist/project-kanban.zip"); assert "v" + json.loads(z.read("manifest.json"))["version"] == os.environ["RELEASE_TAG"]'
      - uses: actions/upload-artifact@v4
        with:
          name: project-kanban-plugin
          path: dist/project-kanban.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project-kanban-plugin
          path: dist
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/project-kanban.zip --verify-tag --generate-notes --title "Project Kanban $RELEASE_TAG"
